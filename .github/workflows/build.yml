name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Waste Reminder v__VERSION__'
          releaseBody: 'Wydanie Waste Reminder v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore

  build-arch:
    needs: build-tauri
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git nodejs npm rust webkit2gtk-4.1 libayatana-appindicator librsvg github-cli

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Tauri binary
        run: |
          npm ci
          npm run tauri build -- --no-bundle

      - name: Package Arch Linux (.pkg.tar.zst)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p pkg_build
          install -Dm755 src-tauri/target/release/waste-reminder pkg_build/waste-reminder
          cat > pkg_build/waste-reminder.desktop <<'EOF'
          [Desktop Entry]
          Name=Waste Reminder
          Exec=waste-reminder
          Type=Application
          Categories=Utility;
          EOF

          cat > pkg_build/PKGBUILD <<EOF
          pkgname=waste-reminder
          pkgver=${VERSION}
          pkgrel=1
          arch=('x86_64')
          pkgdesc="Waste Reminder desktop application"
          depends=('webkit2gtk-4.1' 'libayatana-appindicator' 'librsvg')
          package() {
            install -Dm755 "\$startdir/waste-reminder" "\$pkgdir/usr/bin/waste-reminder"
            install -Dm644 "\$startdir/waste-reminder.desktop" "\$pkgdir/usr/share/applications/waste-reminder.desktop"
          }
          EOF

          useradd --create-home builder
          chown -R builder:builder pkg_build
          su builder -c "cd pkg_build && makepkg --nodeps --noconfirm --cleanbuild"

      - name: Upload Arch package to Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" pkg_build/*.pkg.tar.zst --clobber
