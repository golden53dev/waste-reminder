<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Opcje</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body.options {
        margin: 0;
        padding: 24px;
        background: #1e1e24;
        color: #f0f0f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 18px;
        font-size: 14px;
      }
      h2 {
        margin: 0 0 8px 0;
        font-size: 18px;
        font-weight: 600;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        padding-bottom: 8px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-weight: 500;
        color: #d0d0d0;
      }
      select, input[type="time"] {
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #2a2a32;
        color: #fff;
        font-size: 14px;
        outline: none;
      }
      select:focus, input[type="time"]:focus {
        border-color: #4a90e2;
      }
      .sound-buttons {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      button.btn-sec {
        background: #34343e;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
      }
      button.btn-sec:hover {
        background: #444452;
      }
      .slider-container {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      input[type="range"] {
        flex: 1;
        accent-color: #4a90e2;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }
      .checkbox-label input {
        width: 16px;
        height: 16px;
        accent-color: #4a90e2;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 10px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
      }
      button.btn-primary {
        background: #2563eb;
        border: none;
        color: #fff;
        padding: 8px 18px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button.btn-primary:hover {
        background: #1d4ed8;
      }
      #status-msg {
        font-size: 13px;
        color: #10b981;
        min-height: 18px;
      }
    </style>
  </head>
  <body class="options">
    <h2>Ustawienia</h2>

    <div class="form-group">
      <label for="sound-select">Dźwięk alarmu:</label>
      <select id="sound-select"></select>
      <div class="sound-buttons">
        <button id="btn-play-sound" class="btn-sec" type="button">▶ Odtwórz</button>
        <button id="btn-pick-sound" class="btn-sec" type="button">Wybierz plik...</button>
      </div>
    </div>

    <div class="form-group">
      <label for="volume">Głośność:</label>
      <div class="slider-container">
        <input type="range" id="volume" min="0" max="1" step="0.05" />
        <span id="volume-val" style="width: 45px; text-align: right;">80%</span>
      </div>
    </div>

    <div class="form-group">
      <label for="alert-time">Godzina alarmu (HH:MM):</label>
      <input type="time" id="alert-time" />
    </div>

    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="fullscreen" />
        <span>Pełny ekran przy alarmie</span>
      </label>
    </div>

    <div id="status-msg"></div>

    <div class="actions">
      <button id="btn-cancel" class="btn-sec" type="button">Anuluj</button>
      <button id="btn-save" class="btn-primary" type="button">Zapisz</button>
    </div>

    <script src="options.js"></script>
  </body>
</html>
